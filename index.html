  <title>도살장 격전지 상층 계산기 V 1.1.2</title>

  <style>
    :root{
      --bg:#0f0808; --card:#211212; --card2:#2b1717; --line:#573131;
      --text:#fff8ef; --muted:#d4c0b2; --accent:#e94f42; --accent2:#f5b86b;
      --accent-soft:#3b2020; --gold-soft:#3b2a1b; --ok:#91e3a2; --err:#ff9696;
      --shadow:0 14px 34px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% -10%,rgba(233,79,66,.18),transparent 30%),
        linear-gradient(180deg,#180c0c,#0d0707 68%);
      color:var(--text);min-height:100vh;
    }
    .wrap{max-width:820px;margin:0 auto;padding:14px 10px 36px}
    .hero{text-align:center;padding:6px 0 10px}
    .logo{
      width:92px;height:92px;border-radius:50%;object-fit:cover;
      border:3px solid #f3b76a;box-shadow:0 0 0 4px rgba(233,79,66,.16),var(--shadow);
      background:#2a1717;
    }
    h1{font-size:22px;line-height:1.24;margin:11px 0 3px;letter-spacing:-.55px}
    .version{font-size:13px;color:var(--accent2);font-weight:850;letter-spacing:.05px}
    .card{
      background:linear-gradient(180deg,rgba(47,25,25,.98),rgba(30,16,16,.98));
      border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;
      box-shadow:var(--shadow);
    }
    .label{font-size:14px;font-weight:900;margin-bottom:8px}
    textarea{
      width:100%;min-height:78px;resize:vertical;border:1px solid #6b3b3b;
      background:#120909;color:var(--text);border-radius:13px;padding:12px;
      font-size:16px;line-height:1.42;outline:none;
    }
    textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(255,184,106,.12)}
    .examples{
      font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px;
      padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.018);
      border:1px solid rgba(245,184,107,.10);
    }
    .examples div+div{margin-top:4px}
    .examples b{color:#f4c98f;font-weight:850}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    button{border:0;border-radius:12px;padding:11px 9px;font-size:15px;font-weight:900;cursor:pointer}
    .primary{background:linear-gradient(180deg,#ef5b4d,#c83931);color:#fff}
    .secondary{background:#3a2323;color:#fff;border:1px solid #704040}
    .ghost{background:transparent;color:var(--accent2);border:1px solid #643737;width:100%;margin-top:8px}
    .status{display:none;margin-top:9px;padding:10px 11px;border-radius:11px;font-size:13px;font-weight:850}
    .status.ok{display:block;background:rgba(78,179,103,.14);border:1px solid rgba(143,227,162,.45);color:var(--ok)}
    .status.err{display:block;background:rgba(210,55,55,.13);border:1px solid rgba(255,141,141,.45);color:var(--err)}
    .result{display:none}.result.show{display:block}
    .headline{
      font-size:18px;font-weight:900;line-height:1.34;margin-bottom:10px;color:#fff3df;
      word-break:keep-all;letter-spacing:-.35px;
    }
    .note{
      margin:10px 0 0;padding:9px 10px;border-left:4px solid var(--accent2);
      background:#170b0b;border-radius:8px;font-size:12.2px;line-height:1.5;color:#f3dfce;
    }
    .section-title{font-size:15px;font-weight:900;margin:14px 0 7px;color:#f3c98f}
    .table-wrap{width:100%;overflow:visible;border-radius:11px;border:1px solid #533030}
    table{width:100%;border-collapse:collapse;background:#150a0a;table-layout:fixed}
    th,td{
      padding:9px 4px;border-bottom:1px solid #412424;text-align:center;
      font-size:11.5px;line-height:1.2;vertical-align:middle;
      word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;
    }
    th{
      background:#321b1b;color:#f2c589;font-weight:900;
      letter-spacing:-.18px;
    }
    tr:last-child td{border-bottom:0}
    td:first-child,th:first-child{text-align:left;padding-left:9px}
    .z2-main th:nth-child(1),.z2-main td:nth-child(1){width:18%}
    .z2-main th:nth-child(2),.z2-main td:nth-child(2){width:18%}
    .z2-main th:nth-child(3),.z2-main td:nth-child(3){width:19%}
    .z2-main th:nth-child(4),.z2-main td:nth-child(4){width:23%}
    .z2-main th:nth-child(5),.z2-main td:nth-child(5){width:22%}
    .z2-main th:nth-child(4),.z2-main th:nth-child(5){background:#3b241c;color:#ffd39a}
    .z2-main td:nth-child(4){background:rgba(245,184,107,.045);color:#ffe0ad;font-weight:800}
    .z2-main td:nth-child(5){background:rgba(233,79,66,.055);color:#fff0de;font-weight:900}
    .z1-main th:nth-child(1),.z1-main td:nth-child(1){width:24%}
    .z1-main th:nth-child(2),.z1-main td:nth-child(2){width:28%}
    .z1-main th:nth-child(3),.z1-main td:nth-child(3){width:28%}
    .z1-main th:nth-child(4),.z1-main td:nth-child(4){width:20%}
    .level-table th:nth-child(1),.level-table td:nth-child(1){width:28%}
    .level-table th:nth-child(2),.level-table td:nth-child(2){width:34%}
    .level-table th:nth-child(3),.level-table td:nth-child(3){width:38%}
    .level-table th,.level-table td{padding-top:8px;padding-bottom:8px}
    .level-table td:nth-child(3){font-weight:850;color:#ffe0ad}
    details{margin-top:12px}
    summary{cursor:pointer;font-weight:900;color:#ffd6a5}
    .roster{margin-top:10px;font-size:12px;color:#e5d4c6;line-height:1.55}
    .roster .table-wrap{overflow-x:auto}
    .roster table{min-width:650px;table-layout:auto}
    .footer{text-align:center;font-size:11px;color:#9f8580;padding-top:18px}
    .mini{font-size:11px;color:#cdb8aa;margin-top:8px;line-height:1.45}
    @media (max-width:430px){
      .wrap{padding:10px 8px 30px}
      .logo{width:86px;height:86px}
      h1{font-size:20px}
      .card{padding:11px;border-radius:14px}
      .headline{font-size:17px}
      textarea{font-size:16px;min-height:74px}
      th,td{font-size:10.8px;padding:8px 2px}
      td:first-child,th:first-child{padding-left:5px}
      .note{font-size:11.8px}
      .examples{font-size:12px;padding:7px 9px}
    }
    @media (max-width:360px){
      th,td{font-size:9.4px;padding:7px 1.5px}
      .headline{font-size:16px}
    }

    /* 공유용 결과 보기: 계산식/데이터 로직과 완전히 분리된 표시 전용 UI */
    .share-open{display:none;width:100%;margin:8px 0 0;background:linear-gradient(180deg,#4a2c1d,#332018);color:#ffd79b;border:1px solid #b77a3f;box-shadow:inset 0 0 0 1px rgba(255,215,155,.05)}
    .share-open.show{display:block}
    .share-overlay{display:none;position:fixed;inset:0;z-index:9999;background:#0b0606;overflow-y:auto;padding:18px 12px 36px}
    .share-overlay.show{display:block}
    .share-shell{max-width:720px;margin:0 auto}
    .share-toolbar{display:flex;gap:8px;position:sticky;top:0;z-index:2;padding:0 0 10px;background:linear-gradient(180deg,#0b0606 75%,transparent)}
    .share-toolbar button{flex:1;padding:10px 8px}
    .share-close{background:#3a2323;color:#fff;border:1px solid #704040}
    .share-card{background:linear-gradient(180deg,#2f1919,#1b0e0e);border:2px solid #8a4b3d;border-radius:20px;padding:16px 14px 15px;box-shadow:0 18px 48px rgba(0,0,0,.42)}
    .share-brand{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:0 2px 13px;border-bottom:1px solid #573131}
    .share-logo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #f3b76a;box-shadow:0 0 0 3px rgba(233,79,66,.15)}
    .share-brand-title{font-size:20px;font-weight:950;line-height:1.2;letter-spacing:-.45px}
    .share-brand-version{margin-top:4px;font-size:12.5px;color:#f5b86b;font-weight:850}
    .share-result{padding-top:14px}
    .share-result .headline{font-size:22px;text-align:center;margin:0 0 13px;line-height:1.25}
    .share-result .table-wrap{border-color:#704039;border-radius:12px}
    .share-result table{table-layout:fixed}
    .share-result th,.share-result td{font-size:14px;padding:12px 4px;line-height:1.22}
    .share-result td:first-child,.share-result th:first-child{padding-left:8px}
    .share-result .note{font-size:13.5px;padding:11px 12px;margin-top:12px}
    .share-result #shareDetail{display:none}
    .share-hint{text-align:center;color:#bfa79a;font-size:11px;margin-top:10px}
    @media(max-width:430px){
      .share-overlay{padding:10px 7px 28px}
      .share-card{padding:13px 8px 12px;border-radius:16px}
      .share-brand{grid-template-columns:62px 1fr;gap:9px}
      .share-logo{width:62px;height:62px}
      .share-brand-title{font-size:17px}
      .share-result .headline{font-size:19px}
      .share-result th,.share-result td{font-size:11.8px;padding:10px 2px}
      .share-result td:first-child,.share-result th:first-child{padding-left:5px}
      .share-result .note{font-size:12px}
    }
    @media(max-width:360px){.share-result th,.share-result td{font-size:10.5px}.share-result .headline{font-size:18px}}
  </style>

<script>
"use strict";

const SERVER = 6;

const MEMBERS = {
  "돗돔":       {base:171.9, z1r:0, z2r:5, field:{wolf:7,pirate:6,cat:6,food:6}},
  "매콤갈비":   {base:142.5, z1r:5, z2r:5, field:{wolf:8,pirate:8,cat:8,food:8}},
  "사마엘":     {base:99.5,  z1r:0, z2r:5, field:{wolf:13,pirate:7,cat:7,food:7}},
  "혀녕":       {base:86.4,  z1r:0, z2r:5, field:{wolf:0,pirate:0,cat:0,food:0}},
  "XIGN":       {base:78,    z1r:0, z2r:5, field:{wolf:0,pirate:0,cat:0,food:0}},
  "뱅수띠":     {base:64,    z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}},
  "진니":       {base:57.5,  z1r:0, z2r:5, field:{wolf:7,pirate:6,cat:6,food:6}},
  "토시살":     {base:57,    z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}},
  "페르시안":   {base:57,    z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}},
  "승부왕":     {base:47.4,  z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}},
  "데이다라":   {base:40,    z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}},
  "바포메트":   {base:35.5,  z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}},
  "옥돔":       {base:34.5,  z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}},
  "하니엘":     {base:29,    z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}},
  "벨제붑":     {base:21,    z1r:0, z2r:0, field:{wolf:0,pirate:0,cat:0,food:0}}
};

const ALIASES = {
  "돚돔":"돗돔","돋돔":"돗돔","돝돔":"돗돔","돕돔":"돗돔",
  "매콤":"매콤갈비","갈비":"매콤갈비","메콤":"매콤갈비",
  "사마앨":"사마엘","사무엘":"사마엘","사므엘":"사마엘","샤뮤엘":"사마엘","사마":"사마엘","마엘":"사마엘",
  "혀넝":"혀녕","허녕":"혀녕","허넝":"혀녕",
  "xign":"XIGN","사인":"XIGN","싸인":"XIGN",
  "벵수띠":"뱅수띠","뱅수디":"뱅수띠","벵수디":"뱅수띠","뱅수":"뱅수띠","벵수":"뱅수띠","뱅수씨":"뱅수띠","벵수씨":"뱅수띠",
  "토시":"토시살","토살":"토시살",
  "페르":"페르시안","패르시안":"페르시안","패르":"페르시안","시안":"페르시안",
  "승부":"승부왕","ㅅㅂ왕":"승부왕","슴부왕":"승부왕","슝브왕":"승부왕",
  "데이":"데이다라","다라":"데이다라","대이":"데이다라","대이다라":"데이다라",
  "바포":"바포메트","메트":"바포메트","바포매트":"바포메트","바메":"바포메트",
  "하니":"하니엘","니엘":"하니엘",
  "벨제":"벨제붑","제붑":"벨제붑","밸제":"벨제붑","밸재붑":"벨제붑","밸제붑":"벨제붑","벨재붑":"벨제붑"
};

const BOSSES = {
  "루이": [[15,325000],[16,330000],[17,335000],[18,340000],[19,345000],[20,350000]],
  "루니": [[25,375000],[26,380000],[27,385000],[28,390000],[29,395000],[30,400000]],
  "루나": [[35,425000],[36,430000],[37,435000],[38,440000],[39,445000],[40,450000]],
  "바나냥": [[45,475000],[46,480000],[47,485000],[48,490000],[49,495000],[50,500000]]
};

const REGIONS = {
  "늑대": {key:"wolf",label:"늑대의 숲"},
  "늑대의 숲": {key:"wolf",label:"늑대의 숲"},
  "늑숲": {key:"wolf",label:"늑대의 숲"},
  "해적": {key:"pirate",label:"해적섬"},
  "해적섬": {key:"pirate",label:"해적섬"},
  "고양이": {key:"cat",label:"고양이 협곡"},
  "고양이 협곡": {key:"cat",label:"고양이 협곡"},
  "협곡": {key:"cat",label:"고양이 협곡"},
  "음식": {key:"food",label:"음식의 광장"},
  "음식의 광장": {key:"food",label:"음식의 광장"},
  "광장": {key:"food",label:"음식의 광장"}
};
const REGION_DMG_CORRECTION = 1.0;


function z1Total(name){const m=MEMBERS[name];return m.base+SERVER+m.z1r}
function z2Total(name){const m=MEMBERS[name];return m.base+SERVER+m.z2r}
function fieldBonus(name,key){const m=MEMBERS[name];return m.field ? m.field[key] : null}
function fieldTotal(name,key){
  const b=fieldBonus(name,key);
  return b===null || b===undefined ? null : MEMBERS[name].base+SERVER+b;
}
function fmtNum(n){return Number.isInteger(n)?String(n):String(Number(n.toFixed(1)))}
function fmtInt(n){return Math.round(n).toLocaleString("ko-KR")}
function pct(n,d=1){return Number(n).toFixed(d).replace(/\.0$/,"")+"%"}

function normalizeName(token){
  const t=token.trim();
  if(!t)return null;
  if(Object.prototype.hasOwnProperty.call(MEMBERS,t))return t;
  if(Object.prototype.hasOwnProperty.call(ALIASES,t))return ALIASES[t];
  return null;
}
function tokenize(s){return s.trim().split(/[\s,]+/).map(x=>x.trim()).filter(Boolean)}
function parseHP(s){
  const t=s.trim().replace(/,/g,"");
  let m=t.match(/^(\d+(?:\.\d+)?)\s*만$/);
  if(m)return Math.round(parseFloat(m[1])*10000);
  m=t.match(/^(\d+(?:\.\d+)?)$/);
  if(m)return Math.round(parseFloat(m[1]));
  return null;
}

function parseInput(raw){
  const text=raw.trim();
  if(!text)throw new Error("입력값이 없습니다.");

  let left=null,right=text;
  if(text.includes("/")){
    const parts=text.split("/");
    if(parts.length!==2)throw new Error("슬래시는 한 번만 사용해주세요.");
    left=parts[0].trim(); right=parts[1].trim();
  }

  if(left===null){
    const toks=tokenize(right);
    if(toks.length>=2 && BOSSES[toks[0]]){
      left=toks[0]; right=toks.slice(1).join(" ");
    }
  }

  let mode,boss=null,hp=null,region=null;
  if(left!==null){
    if(BOSSES[left]){mode="z2boss";boss=left}
    else if(REGIONS[left]){mode="region";region=REGIONS[left]}
    else{
      hp=parseHP(left);
      if(hp!==null)mode="z1";
      else throw new Error(`"${left}"는 보스명, 지역명 또는 체력으로 인식되지 않습니다.`);
    }
  }else mode="z2";

  const rawNames=tokenize(right);
  if(rawNames.length===0)throw new Error(mode==="region" ? "닉네임을 입력해주세요." : "참여자를 한 명 이상 입력해주세요.");
  if(mode==="region" && rawNames.length!==1)throw new Error("지역 딜 계산은 닉네임 1명만 입력해주세요.");

  const names=[];
  for(const token of rawNames){
    if(BOSSES[token])throw new Error(`보스명 "${token}"이 참여자 목록에 들어가 있습니다.`);
    const n=normalizeName(token);
    if(!n)throw new Error(`미등록 닉네임/별칭: "${token}"`);
    names.push(n);
  }
  const dup=names.find((n,i)=>names.indexOf(n)!==i);
  if(dup)throw new Error(`중복 참여자: ${dup}`);

  return {raw:text,mode,boss,hp,region,names};
}

function largestRemainder(raws,target,tieGs){
  const floors=raws.map(Math.floor);
  let remaining=target-floors.reduce((a,b)=>a+b,0);
  const ranked=raws.map((r,i)=>({i,frac:r-Math.floor(r),G:tieGs[i]}))
    .sort((a,b)=>(b.frac-a.frac)||(b.G-a.G)||(a.i-b.i));
  const out=floors.slice();
  for(let k=0;k<remaining;k++)out[ranked[k].i]+=1;
  return {out,ranked,remaining};
}

function sortDisplay(items){
  return items.map((x,i)=>({...x,_i:i}))
    .sort((a,b)=>(b.G-a.G)||(a._i-b._i))
    .map(({_i,...x})=>x);
}

function calcZ2(parsed){
  let items=parsed.names.map(name=>{const G=z2Total(name);return {name,G,P:100+G}});
  const S=items.reduce((a,x)=>a+x.P,0);
  items.forEach(x=>x.raw=x.P/S*100);
  const alloc=largestRemainder(items.map(x=>x.raw),100,items.map(x=>x.G));
  items.forEach((x,i)=>{x.N=alloc.out[i];x.exit=Math.max(0,99-x.N)});
  items=sortDisplay(items);
  const levels=parsed.mode==="z2boss"
    ? BOSSES[parsed.boss].map(([lv,hp])=>({lv,hp,sec:Math.round(hp/(10*S)*0.97)}))
    : null;
  return {kind:"z2",parsed,S,items,levels};
}

function calcZ1(parsed){
  let items=parsed.names.map(name=>{const G=z1Total(name);return {name,G,P:100+G}});
  const S=items.reduce((a,x)=>a+x.P,0);
  items.forEach(x=>{x.rawHp=parsed.hp*x.P/S;x.share=x.P/S*100});
  const alloc=largestRemainder(items.map(x=>x.rawHp),parsed.hp,items.map(x=>x.G));
  items.forEach((x,i)=>x.hp=alloc.out[i]);
  items=sortDisplay(items);
  return {kind:"z1",parsed,S,items,sec:Math.round(parsed.hp/(10*S))};
}


function calcRegion(parsed){
  const name=parsed.names[0];
  const key=parsed.region.key;
  const bonus=fieldBonus(name,key);
  if(bonus===null || bonus===undefined){
    throw new Error(`${name}의 ${parsed.region.label} 지역격추가 아직 등록되지 않았습니다.`);
  }
  const G=fieldTotal(name,key);
  const P=100+G;
  const dps=10*P*REGION_DMG_CORRECTION;
  const perMinute=dps*60;
  return {
    kind:"region",parsed,name,key,bonus,G,P,dps,perMinute,
    estimates:[1,2,3].map(min=>({min,damage:Math.round(perMinute*min)}))
  };
}

function compute(raw){
  const p=parseInput(raw);
  if(p.mode==="z1")return calcZ1(p);
  if(p.mode==="region")return calcRegion(p);
  return calcZ2(p);
}

/* V1.1.2 재검증:
   결과 자체만 보는 것이 아니라 원입력부터 재계산한 뒤
   핵심 불변식과 공식, HP/시간을 별도로 다시 검사한다. */
function validateResult(r){
  const problems=[];

  if(r.kind==="region"){
    const bonus=fieldBonus(r.name,r.key);
    const G=fieldTotal(r.name,r.key);
    const P=100+G;
    const perMinute=10*P*60*REGION_DMG_CORRECTION;
    if(bonus===null || bonus===undefined)problems.push("지역격추 미등록");
    if(Math.abs(G-r.G)>1e-9)problems.push("지역 종합격추 오류");
    if(Math.abs(P-r.P)>1e-9)problems.push("지역 화력값 오류");
    if(Math.abs(perMinute-r.perMinute)>1e-9)problems.push("지역 1분 예상딜 오류");
    r.estimates.forEach(x=>{
      if(x.damage!==Math.round(perMinute*x.min))problems.push(`${x.min}분 예상딜 오류`);
    });
  }else if(r.kind==="z2"){
    const original=r.parsed.names.map(name=>({name,G:z2Total(name),P:100+z2Total(name)}));
    const S2=original.reduce((a,x)=>a+x.P,0);
    if(Math.abs(S2-r.S)>1e-9)problems.push("S ≠ ΣP");

    const raws=original.map(x=>x.P/S2*100);
    const expected=largestRemainder(raws,100,original.map(x=>x.G)).out;
    const expectedByName={};
    original.forEach((x,i)=>expectedByName[x.name]=expected[i]);

    const nsum=r.items.reduce((a,x)=>a+x.N,0);
    if(nsum!==100)problems.push("실전 목표 합계 ≠ 100");

    for(const x of r.items){
      if(x.N!==expectedByName[x.name])problems.push(`${x.name} 정수 배분 오류`);
      if(x.exit!==Math.max(0,99-x.N))problems.push(`${x.name} 이탈 기준 오류`);
      if(Math.abs(x.G-z2Total(x.name))>1e-9)problems.push(`${x.name} 최신 격추 오류`);
    }

    if(r.parsed.mode==="z2boss"){
      const ref=BOSSES[r.parsed.boss];
      if(!r.levels || r.levels.length!==ref.length)problems.push("레벨별 상세표 누락");
      else ref.forEach(([lv,hp],i)=>{
        if(r.levels[i].lv!==lv || r.levels[i].hp!==hp)problems.push(`Lv.${lv} HP 오류`);
        const sec=Math.round(hp/(10*S2)*0.97);
        if(r.levels[i].sec!==sec)problems.push(`Lv.${lv} 예상시간 오류`);
      });
    }
  }else{
    const original=r.parsed.names.map(name=>({name,G:z1Total(name),P:100+z1Total(name)}));
    const S2=original.reduce((a,x)=>a+x.P,0);
    if(Math.abs(S2-r.S)>1e-9)problems.push("S ≠ ΣP");

    const rawHp=original.map(x=>r.parsed.hp*x.P/S2);
    const expected=largestRemainder(rawHp,r.parsed.hp,original.map(x=>x.G)).out;
    const expectedByName={};
    original.forEach((x,i)=>expectedByName[x.name]=expected[i]);

    const hsum=r.items.reduce((a,x)=>a+x.hp,0);
    if(hsum!==r.parsed.hp)problems.push("담당 체력 합계 ≠ 입력 HP");
    for(const x of r.items){
      if(x.hp!==expectedByName[x.name])problems.push(`${x.name} 담당 체력 배분 오류`);
      if(Math.abs(x.G-z1Total(x.name))>1e-9)problems.push(`${x.name} 최신 격추 오류`);
    }
    if(r.sec!==Math.round(r.parsed.hp/(10*S2)))problems.push("1구역 예상시간 오류");
  }

  return {pass:problems.length===0,problems};
}

function table(headers,rows,klass=""){
  const wrapClass = klass ? `table-wrap table-wrap-${klass}` : "table-wrap";
  return `<div class="${wrapClass}"><table class="${klass}"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function render(r){
  const result=document.getElementById("result");
  const headline=document.getElementById("headline");
  const main=document.getElementById("mainTable");
  const note=document.getElementById("note");
  const detail=document.getElementById("detail");

  if(r.kind==="region"){
    headline.textContent=`${r.parsed.region.label} · ${r.name} 예상 딜`;
    main.innerHTML=table(
      ["닉네임","지역격추","종합격추","화력값"],
      [[r.name,`+${pct(r.bonus,1)}`,pct(r.G,1),fmtNum(r.P)]],
      "region-main"
    )+
    `<div class="section-title">누적 예상 딜</div>`+
    table(
      ["시간","예상 딜"],
      r.estimates.map(x=>[`${x.min}분`,fmtInt(x.damage)]),
      "level-table"
    );
    note.innerHTML=`<div class="note">※ 공통 격추 공식 기준 이론값입니다. 콘텐츠별 별도 가감식은 사용하지 않으며, 실측자료가 쌓이면 공통 보정계수를 조정할 수 있습니다.</div>`;
    detail.innerHTML="";
  }else if(r.kind==="z2"){
    if(r.parsed.mode==="z2boss"){
      const a=r.levels[0],b=r.levels[r.levels.length-1];
      headline.textContent=`${r.parsed.boss} Lv.${a.lv}~${b.lv} : 예상시간 ${a.sec}초 ~ ${b.sec}초`;
    }else{
      headline.textContent=`2구역 분배 · 화력합 S = ${fmtNum(r.S)}`;
    }

    main.innerHTML=table(
      ["닉네임","이탈 기준","종합 격추","계산 분배","실전 목표"],
      r.items.map(x=>[
        x.name,
        `${x.exit}.xx%`,
        pct(x.G,1),
        `${x.raw.toFixed(2)}%`,
        `${x.N}%`
      ]),
      "z2-main"
    );

    note.innerHTML=`<div class="note">※ 참여자는 반드시 보스 체력이 이탈 기준일 때 완료해야 합니다.</div>`;

    if(r.parsed.mode==="z2boss"){
      detail.innerHTML=`<div class="section-title">레벨별 예상 완료시간</div>`+
        table(
          ["보스 레벨","체력","예상 완료시간"],
          r.levels.map(x=>[`Lv.${x.lv}`,fmtInt(x.hp),`${x.sec}초`]),
          "level-table"
        );
    }else detail.innerHTML="";
  }else{
    headline.textContent=`1구역 ${fmtInt(r.parsed.hp)} 체력 · 예상시간 약 ${r.sec}초`;
    main.innerHTML=table(
      ["닉네임","담당 체력","1구역 종합격추","비중"],
      r.items.map(x=>[x.name,fmtInt(x.hp),pct(x.G,1),`${x.share.toFixed(2)}%`]),
      "z1-main"
    );
    note.innerHTML="";
    detail.innerHTML="";
  }
  result.classList.add("show");
  document.getElementById("shareOpenBtn").classList.add("show");
}

function setStatus(msg,type){
  const s=document.getElementById("status");
  s.className="status "+type;s.textContent=msg;
}

let lastRaw="";

document.getElementById("calcBtn").addEventListener("click",()=>{
  try{
    const raw=document.getElementById("input").value;
    const r=compute(raw);
    const v=validateResult(r);
    if(!v.pass)throw new Error("내부 검증 FAIL · "+v.problems.join(" / "));
    lastRaw=raw;
    render(r);
    setStatus("계산 완료 · V1.1.2 최신 데이터 적용 · 내부 검증 PASS","ok");
  }catch(e){
    document.getElementById("result").classList.remove("show");
    document.getElementById("shareOpenBtn").classList.remove("show");
    setStatus(e.message,"err");
  }
});

document.getElementById("verifyBtn").addEventListener("click",()=>{
  try{
    const raw=document.getElementById("input").value.trim()||lastRaw;
    if(!raw)throw new Error("검증할 입력값이 없습니다.");
    const r=compute(raw);          // 원입력부터 전체 재계산
    const v=validateResult(r);     // 독립 불변식 재검증
    render(r);lastRaw=raw;
    if(v.pass)setStatus("재검증 PASS · 원입력부터 전체 재계산 완료","ok");
    else setStatus("재검증 FAIL · "+v.problems.join(" / "),"err");
  }catch(e){setStatus(e.message,"err")}
});

document.getElementById("clearBtn").addEventListener("click",()=>{
  document.getElementById("input").value="";
  document.getElementById("result").classList.remove("show");
  document.getElementById("shareOpenBtn").classList.remove("show");
  const s=document.getElementById("status");s.className="status";s.textContent="";
  lastRaw="";
});


function openShareView(){
  if(!document.getElementById("result").classList.contains("show"))return;
  document.getElementById("shareHeadline").textContent=document.getElementById("headline").textContent;
  document.getElementById("shareMainTable").innerHTML=document.getElementById("mainTable").innerHTML;
  document.getElementById("shareNote").innerHTML=document.getElementById("note").innerHTML;
  const ov=document.getElementById("shareOverlay");
  ov.classList.add("show");ov.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";ov.scrollTop=0;
}
function closeShareView(){
  const ov=document.getElementById("shareOverlay");
  ov.classList.remove("show");ov.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}
document.getElementById("shareOpenBtn").addEventListener("click",openShareView);
document.getElementById("shareCloseBtn").addEventListener("click",closeShareView);
document.getElementById("shareOverlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeShareView()});

function regionCombined(region,total){
  return `<span class="bonus-total">${pct(region)}<span class="arrow">→</span>${pct(total)}</span>`;
}
function renderRoster(){
  const ordered=Object.entries(MEMBERS).sort((a,b)=>b[1].base-a[1].base);

  document.getElementById("rosterUpper").innerHTML=
    `<div class="roster-note">상층 전용 · 지역격추 → 최종 종합격추</div>`+
    table(
      ["닉네임","기본","서버","1구역 종합","2구역 종합"],
      ordered.map(([n,m])=>[
        n,pct(m.base),"+6%",
        regionCombined(m.z1r,z1Total(n)),
        regionCombined(m.z2r,z2Total(n))
      ]),
      "rosterUpperCompact"
    );

  document.getElementById("rosterField").innerHTML=
    `<div class="roster-note">일반·균열 공용 · 지역격추 → 최종 종합격추</div>`+
    table(
      ["닉네임","기본","서버","늑대(종합)","해적(종합)","고양이(종합)","음식(종합)"],
      ordered.map(([n,m])=>[
        n,pct(m.base),"+6%",
        regionCombined(m.field.wolf,fieldTotal(n,"wolf")),
        regionCombined(m.field.pirate,fieldTotal(n,"pirate")),
        regionCombined(m.field.cat,fieldTotal(n,"cat")),
        regionCombined(m.field.food,fieldTotal(n,"food"))
      ]),
      "rosterFieldCompact"
    );
}
renderRoster();

document.querySelectorAll(".roster-tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".roster-tab").forEach(x=>x.classList.toggle("active",x===btn));
    document.getElementById("rosterUpper").classList.toggle("active",btn.dataset.rosterTab==="upper");
    document.getElementById("rosterField").classList.toggle("active",btn.dataset.rosterTab==="field");
  });
});
const rosterDetails=document.getElementById("rosterDetails");
const rosterHint=document.getElementById("rosterHint");
rosterDetails.addEventListener("toggle",()=>{
  rosterHint.textContent=rosterDetails.open ? "▲ 터치해서 세부표 접기" : "▼ 터치해서 세부표 펼치기";
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js?v=dosaljang-20260912e").then(reg=>reg.update()).catch(()=>{}));
}
